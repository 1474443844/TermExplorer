name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v1.0.1). Leave empty to only build artifacts."
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish release APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & build-tools
        run: |
          sdkmanager --install \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Decode release keystore
        env:
          TERM_KEYSTORE_BASE64: ${{ secrets.TERM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$TERM_KEYSTORE_BASE64" ]; then
            echo "No TERM_KEYSTORE_BASE64 secret — release APKs will be unsigned."
            exit 0
          fi
          mkdir -p keystore
          echo "$TERM_KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          echo "TERM_STORE_FILE=$PWD/keystore/release.jks" >> "$GITHUB_ENV"
          echo "Signing keystore decoded."

      - name: Build release APKs
        env:
          TERM_STORE_PASSWORD: ${{ secrets.TERM_STORE_PASSWORD }}
          TERM_KEY_ALIAS: ${{ secrets.TERM_KEY_ALIAS }}
          TERM_KEY_PASSWORD: ${{ secrets.TERM_KEY_PASSWORD }}
        run: |
          ./gradlew assembleArm64Release assembleX86_64Release \
            --stacktrace --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p dist
          shopt -s nullglob
          for f in app/build/outputs/apk/arm64/release/*.apk \
                   app/build/outputs/apk/x86_64/release/*.apk; do
            cp "$f" dist/
            echo "collected $(basename "$f")"
          done
          ls -la dist/
          test "$(ls dist/*.apk 2>/dev/null | wc -l)" -ge 1

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TermExplorer-release-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG=""
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: '${TAG:-<none>}'"

      - name: Create GitHub Release
        if: ${{ steps.tag.outputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: TermExplorer ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: dist/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
